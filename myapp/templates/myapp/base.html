<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}租房合同工作台{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/vue@3.5.13/dist/vue.global.prod.js"></script>
    <script>
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        // 全局认证状态管理
        window.AuthManager = {
            // 保存用户信息到localStorage
            saveUser: function(user) {
                if (user) {
                    localStorage.setItem('user', JSON.stringify(user));
                    localStorage.setItem('isLoggedIn', 'true');
                } else {
                    localStorage.removeItem('user');
                    localStorage.removeItem('isLoggedIn');
                }
            },
            
            // 从localStorage获取用户信息
            getUser: function() {
                const userStr = localStorage.getItem('user');
                if (userStr) {
                    try {
                        return JSON.parse(userStr);
                    } catch (e) {
                        return null;
                    }
                }
                return null;
            },
            
            // 检查是否已登录
            isLoggedIn: function() {
                return localStorage.getItem('isLoggedIn') === 'true' && this.getUser() !== null;
            },
            
            // 清除登录状态
            clearAuth: function() {
                localStorage.removeItem('user');
                localStorage.removeItem('isLoggedIn');
            }
        };
    </script>
    <style>
        :root {
            --bg-deep: #07060d;
            --glass: rgba(255, 255, 255, 0.06);
            --glass-border: rgba(255, 255, 255, 0.12);
            --text: #f1f0f7;
            --muted: #9b96b0;
            --cyan: #2dd4bf;
            --violet: #a78bfa;
            --rose: #fb7185;
            --amber: #fbbf24;
            --err: #f87171;
            --ok: #4ade80;
        }
        *, *::before, *::after { box-sizing: border-box; }
        html { -webkit-font-smoothing: antialiased; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Noto Sans SC", system-ui, sans-serif;
            color: var(--text);
            background: var(--bg-deep);
            font-size: 15px;
            line-height: 1.55;
        }
        .page {
            position: relative;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .page::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: 0;
            background:
                radial-gradient(ellipse 90% 70% at 10% -10%, rgba(167, 139, 250, 0.35), transparent 50%),
                radial-gradient(ellipse 70% 50% at 90% 10%, rgba(45, 212, 191, 0.22), transparent 45%),
                radial-gradient(ellipse 60% 40% at 50% 100%, rgba(251, 113, 133, 0.12), transparent 50%),
                linear-gradient(180deg, #0c0a14 0%, #07060d 100%);
            pointer-events: none;
        }
        .page::after {
            content: "";
            position: fixed;
            inset: 0;
            z-index: 0;
            opacity: 0.35;
            background-image:
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 48px 48px;
            pointer-events: none;
        }
        .shell {
            position: relative;
            z-index: 1;
            max-width: 52rem;
            margin: 0 auto;
            padding: 2.5rem 1.35rem 4rem;
        }
        /* 顶栏导航 */
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding: 1rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .top-nav .logo {
            font-family: "Syne", sans-serif;
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--cyan);
            text-decoration: none;
        }
        .top-nav .nav-links {
            display: flex;
            gap: 1.5rem;
            align-items: center;
        }
        .top-nav .nav-links a {
            color: var(--muted);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        .top-nav .nav-links a:hover,
        .top-nav .nav-links a.active {
            color: var(--text);
        }
        .top-nav .user-menu {
            display: flex;
            gap: 1rem;
            align-items: center;
        }
        .top-nav .user-menu button {
            background: transparent;
            border: 1px solid var(--glass-border);
            color: var(--text);
            padding: 0.5rem 1rem;
            border-radius: 0.65rem;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .top-nav .user-menu button:hover {
            background: rgba(255, 255, 255, 0.05);
        }
        /* 玻璃面板 */
        .glass {
            padding: 1.35rem 1.4rem;
            border-radius: 1.15rem;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(16px);
            margin-bottom: 1.15rem;
        }
        .glass h2 {
            font-family: "Syne", sans-serif;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--violet);
            margin: 0 0 1rem;
        }
        label.lbl {
            display: block;
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--muted);
            margin-bottom: 0.5rem;
        }
        input.inp, textarea.inp, select.inp {
            width: 100%;
            font: inherit;
            padding: 0.65rem 0.85rem;
            border-radius: 0.65rem;
            border: 1px solid var(--glass-border);
            background: rgba(0, 0, 0, 0.35);
            color: var(--text);
        }
        input.inp:focus, textarea.inp:focus, select.inp:focus {
            outline: none;
            border-color: rgba(45, 212, 191, 0.5);
            box-shadow: 0 0 0 3px rgba(45, 212, 191, 0.12);
        }
        textarea.inp {
            min-height: 10rem;
            resize: vertical;
            line-height: 1.6;
        }
        .row-btns {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
            margin-top: 1rem;
        }
        .btn {
            font: inherit;
            font-weight: 600;
            padding: 0.65rem 1.25rem;
            border-radius: 0.65rem;
            border: none;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #2dd4bf 0%, #5eead4 100%);
            color: #0f172a;
            box-shadow: 0 0 20px rgba(45, 212, 191, 0.25);
        }
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 0 28px rgba(45, 212, 191, 0.35);
        }
        .btn-ghost {
            background: transparent;
            border: 1px solid var(--glass-border);
            color: var(--text);
        }
        .btn-ghost:hover {
            background: rgba(255, 255, 255, 0.05);
        }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.85rem 1rem;
        }
        @media (max-width: 640px) {
            .form-grid { grid-template-columns: 1fr; }
        }
        .form-grid .field-span-2 { grid-column: 1 / -1; }
        .sub-h {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--cyan);
            margin: 0.5rem 0 0.35rem;
            letter-spacing: 0.06em;
        }
        .msg-ok {
            background: rgba(74, 222, 128, 0.1);
            border: 1px solid rgba(74, 222, 128, 0.3);
            color: var(--ok);
            padding: 0.75rem 1rem;
            border-radius: 0.65rem;
            margin-bottom: 1rem;
        }
        .msg-err {
            background: rgba(248, 113, 113, 0.1);
            border: 1px solid rgba(248, 113, 113, 0.3);
            color: var(--err);
            padding: 0.75rem 1rem;
            border-radius: 0.65rem;
            margin-top: 0.5rem;
        }
        .spin {
            display: inline-block;
            width: 1em;
            height: 1em;
            border: 2px solid rgba(0,0,0,0.1);
            border-top-color: currentColor;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 0.4em;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .risk {
            font-family: "Syne", sans-serif;
            font-size: clamp(1.75rem, 5vw, 2.25rem);
            font-weight: 800;
            letter-spacing: -0.03em;
            margin: 0.25rem 0 1rem;
            line-height: 1.2;
        }
        .risk.high {
            background: linear-gradient(90deg, #f87171, #fb7185);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 0 24px rgba(251, 113, 133, 0.35));
        }
        .risk.medium {
            background: linear-gradient(90deg, #fbbf24, #f97316);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .risk.low {
            background: linear-gradient(90deg, #4ade80, #2dd4bf);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        blockquote.sum {
            margin: 0 0 1rem;
            padding: 1rem 1.1rem;
            border-radius: 0.75rem;
            border-left: 3px solid var(--violet);
            background: rgba(139, 92, 246, 0.08);
            font-size: 0.88rem;
            color: #ddd8ec;
        }
        ul.issues {
            margin: 0;
            padding: 0;
            list-style: none;
        }
        ul.issues li {
            padding: 0.85rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 0.88rem;
        }
        ul.issues li:last-child { border-bottom: none; }
        ul.issues .id {
            display: inline-block;
            margin-right: 0.35rem;
            padding: 0.15rem 0.45rem;
            border-radius: 0.35rem;
            font-size: 0.72rem;
            font-weight: 700;
            background: rgba(167, 139, 250, 0.2);
            color: #ddd6fe;
        }
        ul.issues .cl {
            display: block;
            margin-top: 0.45rem;
            color: var(--muted);
            font-size: 0.82rem;
            line-height: 1.45;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    {% csrf_token %}
    {% block content %}{% endblock %}

    {% block extra_js %}{% endblock %}
</body>
</html>
