<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>租房合同生成</title>
    <script src="https://cdn.bootcdn.net/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/modern-normalize/modern-normalize.css">
    <style>
        :root{
            --bg:#f5f7fb; --card:#ffffff; --muted:#6b7280; --accent:#2563eb; --accent-600:#1e40af; --danger:#dc2626; --radius:12px;
            --glass: rgba(255,255,255,0.6);
        }
        *{box-sizing:border-box}
        html,body{height:100%}
        body { font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; margin:0; padding:28px; background:linear-gradient(180deg,#f6f9ff 0%,var(--bg) 100%); color:#0f172a }
        h1{margin:0 0 8px 0; font-size:1.6rem}
        .container { max-width:1100px; margin:18px auto; display:grid; grid-template-columns: 1fr 420px; gap:20px; align-items:start }
        @media (max-width:980px){ .container{grid-template-columns:1fr} }
        .card { background:var(--card); border-radius:var(--radius); padding:18px; box-shadow:0 6px 18px rgba(15,23,42,0.06); border:1px solid rgba(15,23,42,0.04) }
        label { display:block; margin-top:10px; font-weight:600; color:#0f172a }
        input, textarea, select { width:100%; padding:10px 12px; margin-top:6px; border-radius:8px; border:1px solid #e6eef8; background:linear-gradient(180deg,#fff,#fbfdff); outline:none }
        input:focus, textarea:focus, select:focus { border-color:var(--accent); box-shadow:0 4px 12px rgba(37,99,235,0.08) }
        textarea{min-height:90px}
        .inline { display:flex; gap:10px }
        .inline > * { flex:1 }
        .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:9px 14px; background:var(--accent); color:#fff; border-radius:10px; cursor:pointer; border:none; font-weight:600 }
        .btn.secondary { background:#f3f4f6; color:#111827; box-shadow:none; border:1px solid rgba(15,23,42,0.04) }
        .btn:active{transform:translateY(1px)}
        #preview { white-space:pre-wrap; background:linear-gradient(180deg,#ffffff,#fbfdff); min-height:300px; padding:18px; border-radius:10px; border:1px solid rgba(15,23,42,0.04); font-family: "Noto Serif SC", serif; line-height:1.8; color:#0b1220 }
        .clauses-list { margin-top:8px }
        .clause-item{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:8px; padding:8px; background:var(--glass); border-radius:8px; border:1px solid rgba(2,6,23,0.04) }
        .small { font-size:0.9rem; color:var(--muted); margin-top:8px }
        .muted{color:var(--muted)}
        .file-row{display:flex; gap:10px; align-items:center}
        .tag{display:inline-block;padding:6px 8px;border-radius:8px;background:#eef2ff;color:var(--accent-600);font-weight:600}
    </style>
</head>
<body>
    <h1 style = "text-align: center;">租房合同生成器</h1>
    <p class="small" style = "text-align: center;">填写双方信息、可添加额外条款，点击“预览合同”生成文本，支持 PDF 下载与合同文件上传合规检查。</p>

    <div class="container">
        <div class="card">
            <h2>基础信息</h2>
            <form id="contractForm">
                <h3>房东信息</h3>
                <label>姓名 <input type="text" id="landlord_name" placeholder="房东姓名"></label>
                <label>身份证/证件号 <input type="text" id="landlord_id" placeholder="身份证号"></label>
                <label>联系电话 <input type="text" id="landlord_phone" placeholder="手机号"></label>

                <h3>租户信息</h3>
                <label>姓名 <input type="text" id="tenant_name" placeholder="租户姓名"></label>
                <label>身份证/证件号 <input type="text" id="tenant_id" placeholder="身份证号"></label>
                <label>联系电话 <input type="text" id="tenant_phone" placeholder="手机号"></label>

                <h3>租赁信息</h3>
                <label>房屋地址 <input type="text" id="property_address" placeholder="例如：北京市朝阳区XX小区XX号"></label>
                <label class="inline">租金（月） <input type="number" id="rent" placeholder="租金（元/月）"> 押金 <input type="number" id="deposit" placeholder="押金（元）"></label>
                <label class="inline">起始日期 <input type="date" id="start_date"> 结束日期 <input type="date" id="end_date"></label>
                <label>付款方式 <select id="payment_method"><option value="月付">月付</option><option value="季付">季付</option><option value="年付">年付</option></select></label>

                <h3>额外条款</h3>
                <label>新增条款（单条） <input type="text" id="clause_input" placeholder="例如：禁止养宠物"></label>
                <div style="margin-top:8px">
                    <button type="button" id="addClause" class="btn secondary">添加条款</button>
                </div>
                <div class="clauses-list" id="clausesList"></div>

                <div style="margin-top:12px" class="inline">
                    <button type="button" id="previewBtn" class="btn">预览合同</button>
                    <button type="button" id="downloadPdfBtn" class="btn">下载 PDF</button>
                </div>
            </form>

            <hr>
            <h3>上传合同进行合规检查</h3>
            <input type="file" id="contractFile" accept="application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document">
            <div style="margin-top:12px">
                <h4>或直接输入合同内容</h4>
                <textarea id="contractContent" placeholder="请粘贴您的租房合同内容" style="min-height:150px"></textarea>
            </div>
            <div style="margin-top:8px" class="inline">
                <button id="uploadBtn" class="btn">上传文件并检查</button>
                <button id="checkContentBtn" class="btn">检查输入内容</button>
            </div>
            <div id="complianceResult" style="margin-top:12px"></div>
        </div>

        <div class="card">
            <h2>合同预览</h2>
            <div id="preview">请填写信息后点击“预览合同”。</div>
            <div style="margin-top:12px; font-size:0.9rem; color:#666">
                <strong>提示：</strong>预览区域将按中文合同格式生成可下载的 PDF。如需后端合成或保存，请提供相应接口，我可以一并实现。
            </div>
        </div>
    </div>

    <!-- 引入外部脚本：html2canvas + jsPDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script>
        // CSRF helper: 从 cookie 中读取 csrftoken，并为非安全方法自动设置 X-CSRFToken 头
        function getCookie(name) {
            const v = document.cookie.match('(^|;)\\s*' + name + '\\s*=\\s*([^;]+)');
            return v ? v.pop() : '';
        }

        function stripThink(input){
            return input.replace(/<think>[\s\S]*?<\/think>\s*/i, '').trim();
        }

        $.ajaxSetup({
            beforeSend: function(xhr, settings) {
                if (!(/^GET|HEAD|OPTIONS|TRACE$/i.test(settings.type)) && !this.crossDomain) {
                    xhr.setRequestHeader('X-CSRFToken', getCookie('csrftoken'));
                }
            }
        });

        const clausesrow = [];
        const clauses = [];
        const clausesList = document.getElementById('clausesList');
        document.getElementById('addClause').addEventListener('click', ()=>{
            const val = document.getElementById('clause_input').value.trim();
            if(!val) return alert('请输入条款内容');
            $.ajax({
                url: 'http://localhost:8000/generate/generate/',
                type: 'post', // GET、POST、PUT、DELETE 等
                data: {
                    'demand':val,
                }, // 可省略
                dataType: 'json', // json, xml, text, html 等
                success: function(data, status, xhr) {
                    clauses.push(stripThink(data.result));
                    // 请求成功时的回调函数，`data` 是服务器返回的数据
                },
                error: function(xhr, status, error) {
                    // 请求失败时的回调函数
                },
            });
            clausesrow.push(val);
            renderClauses();
            document.getElementById('clause_input').value = '';
        });

        function renderClauses(){
            clausesList.innerHTML = '';
            clausesrow.forEach((c,idx)=>{
                const div = document.createElement('div');
                div.style.display='flex'; div.style.justifyContent='space-between'; div.style.alignItems='center'; div.style.marginTop='6px';
                div.innerHTML = `<div style="flex:1">${idx+1}. ${escapeHtml(c)}</div>`;
                const rm = document.createElement('button'); rm.textContent='移除'; rm.className='btn secondary'; rm.style.padding='4px 8px'; rm.onclick = ()=>{ clauses.splice(idx,1); renderClauses(); };
                div.appendChild(rm);
                clausesList.appendChild(div);
            });
        }

        function escapeHtml(s){ return s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;'); }

        function buildContractText(){
            const L = id => document.getElementById(id).value || '';
            const landlord_name = L('landlord_name');
            const landlord_id = L('landlord_id');
            const landlord_phone = L('landlord_phone');
            const tenant_name = L('tenant_name');
            const tenant_id = L('tenant_id');
            const tenant_phone = L('tenant_phone');
            const property_address = L('property_address');
            const rent = L('rent');
            const deposit = L('deposit');
            const start_date = L('start_date');
            const end_date = L('end_date');
            const payment_method = L('payment_method');

            let text = '';
            text += `租赁双方：\n甲方（房东）：${landlord_name}，证件号：${landlord_id}，电话：${landlord_phone}\n`;
            text += `乙方（租户）：${tenant_name}，证件号：${tenant_id}，电话：${tenant_phone}\n\n`;
            text += `第一条 房屋信息\n房屋坐落：${property_address}\n租赁期限：自 ${start_date} 起至 ${end_date} 止\n`;
            text += `租金及押金：租金为 ${rent} 元/${payment_method}，押金为 ${deposit} 元。\n付款方式：${payment_method}。\n\n`;
            text += `第二条 使用及维护\n双方应按国家法律法规及本合同约定使用并维护房屋及设施。未经同意不得擅自改变房屋结构。\n\n`;
            if(clauses.length){
                text += `第三条 额外约定条款\n`;
                clauses.forEach((c, i)=>{ text += `${i+1}. ${c}\n`; });
                text += `\n`;
            }
            text += `第四条 违约责任与争议解决\n发生争议，双方应友好协商；协商不成的，向房屋所在地人民法院提起诉讼。\n\n`;
            text += `甲方签字：__________________    日期：____年__月__日\n乙方签字：__________________    日期：____年__月__日\n`;
            return text;
        }
        document.getElementById('previewBtn').addEventListener('click', ()=>{
            const txt = buildContractText();
            document.getElementById('preview').textContent = txt;
        });

        document.getElementById('downloadPdfBtn').addEventListener('click', async ()=>{
            const previewEl = document.getElementById('preview');
            // ensure preview up-to-date
            previewEl.textContent = buildContractText();
            // use html2canvas + jsPDF to export
            const canvas = await html2canvas(previewEl, { scale: 2 });
            const img = canvas.toDataURL('image/png');
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF({ unit: 'mm', format: 'a4' });
            const pageWidth = 210; // mm
            const imgProps = pdf.getImageProperties(img);
            const pdfHeight = (imgProps.height * pageWidth) / imgProps.width;
            pdf.addImage(img, 'PNG', 0, 0, pageWidth, pdfHeight);
            pdf.save('租房合同.pdf');
        });

        // 上传文件并合规检查
        document.getElementById('uploadBtn').addEventListener('click', async ()=>{
            const fileEl = document.getElementById('contractFile');
            const file = fileEl.files[0];
            if(!file) return alert('请选择合同文件上传');
            const fd = new FormData(); 
            fd.append('upload_file', file);
            const target = '/check/check/';
            document.getElementById('complianceResult').textContent = '上传中……';
            try{
                const res = await fetch(target, { 
                    method:'POST', 
                    body: fd,
                    headers: {
                        'X-CSRFToken': getCookie('csrftoken')
                    }
                });
                if(!res.ok) throw new Error('服务器返回 '+res.status);
                const data = await res.json();
                if(data.code === 200){
                    document.getElementById('complianceResult').innerHTML = `<div style="color:green">合规检查完成</div><pre style="white-space:pre-wrap; background:#f5f5f5; padding:10px; border-radius:8px; margin-top:8px; font-size:0.9rem">${escapeHtml(data.content)}</pre>`;
                } else {
                    document.getElementById('complianceResult').innerHTML = `<div style="color:#b44">检查失败</div><div>错误：${data.message||'未知错误'}</div>`;
                }
            }catch(e){
                document.getElementById('complianceResult').textContent = '上传或检查失败：' + e.message;
            }
        });

        // 检查直接输入的合同内容
        document.getElementById('checkContentBtn').addEventListener('click', async ()=>{
            const content = document.getElementById('contractContent').value.trim();
            if(!content) return alert('请输入合同内容');
            const target = '/check/check/';
            document.getElementById('complianceResult').textContent = '检查中……';
            try{
                const res = await fetch(target, { 
                    method:'POST', 
                    body: JSON.stringify({contract_content: content}),
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCookie('csrftoken')
                    }
                });
                if(!res.ok) throw new Error('服务器返回 '+res.status);
                const data = await res.json();
                if(data.code === 200){
                    document.getElementById('complianceResult').innerHTML = `<div style="color:green">合规检查完成</div><pre style="white-space:pre-wrap; background:#f5f5f5; padding:10px; border-radius:8px; margin-top:8px; font-size:0.9rem">${escapeHtml(data.content)}</pre>`;
                } else {
                    document.getElementById('complianceResult').innerHTML = `<div style="color:#b44">检查失败</div><div>错误：${data.message||'未知错误'}</div>`;
                }
            }catch(e){
                document.getElementById('complianceResult').textContent = '检查失败：' + e.message;
            }
        });
    </script>
</body>
</html>
